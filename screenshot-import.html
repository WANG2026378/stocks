<!doctype html>
<html lang="zh-TW"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>截圖更新持股</title>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<style>body{font:16px system-ui;background:#f5f7f9;color:#182828;margin:0}main{max-width:850px;margin:auto;padding:24px}section{background:white;padding:20px;border-radius:12px;margin:16px 0}button,a,select,input{font:inherit}button{background:#1a6b6b;color:white;border:0;border-radius:6px;padding:10px 16px;cursor:pointer}button:disabled{opacity:.5;cursor:wait}input,select{padding:8px;max-width:100%;box-sizing:border-box}textarea{width:100%;box-sizing:border-box;height:180px;font:14px monospace}table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:8px;border-bottom:1px solid #ddd}td input{width:100%}#preview{max-width:100%;max-height:360px}#status{white-space:pre-wrap}a{color:#1a6b6b}.scroll{overflow-x:auto}</style></head>
<body><main><a href="index.html">← 回到損益追蹤器</a><h1>📷 截圖更新存股數</h1>
<p>選擇券商持股截圖，辨識後確認股票代碼與股數。只更新勾選股票的股數，既有成本、均價及股價會保留。若交易成本也有改變，請回主頁編輯。</p>
<section><label>市場 <select id="market"><option value="TW">台股</option><option value="US">美股</option></select></label><p><input id="file" type="file" accept="image/*"></p><img id="preview" alt="持股截圖預覽" hidden><p><button id="recognize" disabled>辨識截圖</button></p><p id="status" role="status" aria-live="polite">請選擇清晰的截圖。圖片在瀏覽器內辨識；首次使用需下載辨識模型。</p></section>
<section><h2>辨識文字</h2><p>若辨識不完整，可修正文字後重新整理。每行格式例如「2330 台積電 2030」或「AAPL 10.5」。數量請用股，1 張＝1000 股。</p><textarea id="text" aria-label="辨識文字"></textarea><p><button id="parse">整理確認表格</button></p></section>
<section><h2>確認後更新</h2><p>辨識可能有誤。股數不會自動推測，請對照截圖填入；未勾選的股票會保留。</p><div class="scroll"><table><thead><tr><th>套用</th><th>代碼</th><th>名稱</th><th>原股數</th><th>截圖股數（股）</th></tr></thead><tbody id="rows"></tbody></table></div><p><button id="apply" disabled>確認更新股數</button></p></section>
<script>
const keys={TW:'tw_stocks_v5',US:'us_stocks_v1'};
const el=id=>document.getElementById(id);
let imageURL=null,rows=[],busy=false;
function load(){try{return JSON.parse(localStorage.getItem(keys[el('market').value]))||[];}catch{throw Error('本機持股資料無法讀取，請先回主頁確認。');}}
function status(s){el('status').textContent=s;}
function reset(){rows=[];el('rows').replaceChildren();el('apply').disabled=true;}
el('market').onchange=()=>{reset();status('市場已變更，請重新整理確認表格。');};
el('file').onchange=()=>{
 reset();el('text').value='';if(imageURL)URL.revokeObjectURL(imageURL);
 const f=el('file').files[0];el('recognize').disabled=!f;
 el('preview').hidden=!f;if(f){imageURL=URL.createObjectURL(f);el('preview').src=imageURL;status('截圖已載入，點擊「辨識截圖」。');}
};
el('recognize').onclick=async()=>{
 if(busy||!el('file').files[0])return;
 busy=true;el('recognize').disabled=true;el('market').disabled=true;el('file').disabled=true;reset();let worker;
 try{
  if(!window.Tesseract)throw Error('辨識程式未載入，請檢查網路後重新整理。');
  worker=await Tesseract.createWorker('chi_tra+eng',1,{logger:m=>status('辨識中：'+Math.round((m.progress||0)*100)+'%（'+m.status+'）')});
  const result=await worker.recognize(el('file').files[0]);el('text').value=result.data.text;
  parse();status('辨識完成。請對照截圖，確認每檔股數後勾選套用。');
 }catch(e){status('辨識失敗：'+e.message+'\n你仍可在辨識文字欄輸入代碼與股數。');}
 finally{if(worker)await worker.terminate();busy=false;el('recognize').disabled=false;el('market').disabled=false;el('file').disabled=false;}
};
function parse(){
 reset();const holdings=load(),tw=el('market').value==='TW';
 for(const line of el('text').value.split(/\n/)){
  const tokens=line.toUpperCase().match(tw?/\b\d{4,6}[A-Z]?\b/g:/\b[A-Z][A-Z0-9.-]{0,9}\b/g)||[];
  const code=tokens.find(c=>holdings.some(s=>s.code.toUpperCase()===c))||tokens[0];
  if(!code||rows.some(r=>r.code===code))continue;
  const old=holdings.find(s=>s.code.toUpperCase()===code);
  // Only prefill an unambiguous code + single quantity line.
  const clean=line.replace(code,'').trim();
  const numeric=clean.match(/^(?:[^\d]+\s+)?([\d,]+(?:\.\d+)?)\s*(股|張)?$/);
  const quantity=numeric?Number(numeric[1].replace(/,/g,''))*(numeric[2]==='張'?1000:1):null;
  const tr=document.createElement('tr');const cells=Array.from({length:5},()=>tr.appendChild(document.createElement('td')));
  const check=document.createElement('input');check.type='checkbox';check.setAttribute('aria-label','套用 '+code);cells[0].append(check);
  cells[1].textContent=code;
  const name=document.createElement('input');name.value=old?.name||'';name.placeholder='新股票需填名稱';name.setAttribute('aria-label',code+' 名稱');cells[2].append(name);
  cells[3].textContent=old?.shares??'新股票';
  const input=document.createElement('input');input.type='number';input.min='0';input.step='any';input.value=quantity??'';input.placeholder='請對照截圖填股數';input.setAttribute('aria-label',code+' 股數');cells[4].append(input);
  el('rows').append(tr);rows.push({code,check,input,name});
 }
 el('apply').disabled=!rows.length;
 if(!rows.length)status('沒有找到股票代碼，請在文字欄補上代碼與股數。');
}
el('parse').onclick=()=>{try{parse();}catch(e){status(e.message);}};
el('apply').onclick=()=>{
 try{
  const chosen=rows.filter(r=>r.check.checked);if(!chosen.length)throw Error('請勾選要更新的股票。');
  for(const r of chosen)if(r.input.value.trim()===''||!Number.isFinite(Number(r.input.value))||Number(r.input.value)<0||!r.name.value.trim())throw Error(r.code+'：請填寫有效股數與名稱。');
  const holdings=load();
  for(const r of chosen){const shares=Number(r.input.value),old=holdings.find(s=>s.code.toUpperCase()===r.code);
   if(old)old.shares=shares;
   else holdings.push({code:r.code,name:r.name.value.trim(),shares,price:0,avg:0,cost:0,be:0,sector:'其他',note:''});
  }
  localStorage.setItem(keys[el('market').value],JSON.stringify(holdings));
  el('apply').disabled=true;status('已更新 '+chosen.length+' 檔股數。回到損益追蹤器即可查看，再點「更新股價」取得報價。新股票的成本與均價請在主頁補齊。');
 }catch(e){status(e.message);}
};
</script></main></body></html>
